# TalkByte AI Nginx Configuration Template
# Replace your-domain.com and api.your-domain.com with your actual domains.
# Place this file in /etc/nginx/sites-available/ and symlink to sites-enabled/

# ---------------------------------------
# Frontend (Next.js) - Port 3000
# ---------------------------------------
server {
    listen 80;
    server_name your-domain.com www.your-domain.com;

    # Certbot will automatically add SSL configuration here later

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------------------------------------
# Backend API (FastAPI) - Port 8000
# ---------------------------------------
server {
    listen 80;
    server_name api.your-domain.com;

    # Certbot will automatically add SSL configuration here later

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-running AI voice streams
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}
